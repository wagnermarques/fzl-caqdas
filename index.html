<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006a6a" />
    <meta name="description" content="Assistente de Pesquisa Qualitativa — CAQDAS com Web Components e Lit" />
    <title>Pesquisador Qualitativo — CAQDAS</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Auto-recuperação de cache e Service Worker desatualizado
      window.addEventListener('error', function (e) {
        if (e && e.message && e.message.includes('socialAuth') && !sessionStorage.getItem('__fzl_sw_healed__')) {
          sessionStorage.setItem('__fzl_sw_healed__', '1');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (r) { return r.unregister(); }));
            }).then(function () {
              if ('caches' in window) {
                return caches.keys().then(function (names) {
                  return Promise.all(names.map(function (n) { return caches.delete(n); }));
                });
              }
            }).then(function () {
              window.location.reload();
            });
          }
        }
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!window.__fzl_controller_reloading__) {
            window.__fzl_controller_reloading__ = true;
            window.location.reload();
          }
        });
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
